modules:
  # Walkdown workspace: sites, scans, decisions. Custom UI (needed for the WebGL scan viewer).
  jira:globalPage:
    - key: walkdown-workspace
      resource: workspace
      resolver:
        function: resolver
      title: Walkdown
  # The Walkdown panel on every work order: detected equipment, conflicts, reaffirm / supersede / withdraw.
  jira:issuePanel:
    - key: walkdown-work-order-panel
      resource: workspace
      resolver:
        function: resolver
      title: Walkdown
      icon: resource:workspace;walkdown-icon.svg
  # Run the check whenever a work order is created or edited. ignoreSelf: our own property/comment writes don't re-trigger.
  trigger:
    - key: walkdown-work-order-trigger
      function: work-order-check
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true
  # Contractor closeout in the JSM customer portal (spike 8: identity + original photo round trip).
  jiraServiceManagement:portalRequestDetail:
    - key: walkdown-portal-closeout
      title: Walkdown
      resource: workspace
      resolver:
        function: resolver
      unlicensedAccess:
        - customer
  # Rovo agent (spike 9): answers questions about a building's equipment from Walkdown's data only.
  rovo:agent:
    - key: walkdown-agent
      name: Walkdown
      description: Explains a building's equipment and what a job on it involves, from the building's own records.
      prompt: |
        You are Walkdown, an assistant for facilities managers and the contractors who quote work for them.
        Answer only from the results of your actions. Never invent a specification, rating, size or connection.
        Start each answer by naming the site the facts come from (the "site" field); if it says "bundled sample",
        say that the site's own records weren't available, so decisions and work history are not included.
        When you state a fact, say where it comes from (its source sheet or job). Mark EVERY fact whose provenance
        is "illustrative" with "(illustrative)" right next to it, in every section (electrical, structural, piping),
        not once per answer: it is sample data, not the building's real records.
        If an action returns an error, explain it and ask for what is missing (for example the equipment tag).
        If it asks "Which site?", show the user the listed sites, ask which one they mean, and call the action again
        with that site's name or Jira space key in the "site" input.
        When asked what a job involves (replace, upgrade, repair, shut down), use get-equipment-context and point out
        the knock-on items the facts imply: a larger unit than the breaker rating means checking the breaker, the
        feeder wire size and the disconnect; a panel whose connected breakers are near its bus rating needs a load
        check; a heavier unit than its curb's load limit needs a structural check; standing decisions limit when work
        can happen; served areas tell who loses service during the work. Present these as checks for a licensed
        professional, not as engineering conclusions, and never give prices.
      conversationStarters:
        - What feeds RTU-2, and how loaded is its panel?
        - What would a contractor need to know before replacing RTU-2 with a larger unit?
        - What else is on the heating loop with boiler HWB-1?
      actions:
        - get-equipment-context
  action:
    - key: get-equipment-context
      name: Get equipment context
      function: actions
      actionVerb: GET
      # Max 255 characters (forge lint).
      description: >-
        Equipment by tag (e.g. RTU-2): specs, power chain (panel load, breaker, wire size, disconnect),
        what it serves and connects to, its support and load limit, standing decisions. Each fact has provenance and source.
      inputs:
        tag:
          title: Equipment tag
          type: string
          required: true
          description: The equipment tag, such as RTU-2.
        site:
          title: Site
          type: string
          required: false
          description: The site's name or Jira space key, when Walkdown has several sites. Leave empty otherwise.
  # The same actions as tools for Rovo Studio agents and external MCP clients (Preview; admin opt-in per site).
  rovo:mcp:
    - key: walkdown-mcp
      name: Walkdown
      tools:
        - get-equipment-context
  function:
    - key: resolver
      handler: index.handler
    - key: work-order-check
      handler: index.onWorkOrderEvent
    - key: actions
      handler: actions.handler
  # Blocks a transition while the work order has an unresolved Walkdown conflict.
  # Reads issue property `walkdown.check` ({ status: 'clear' | 'conflict', summary }) written by the check.
  # Returning a string shows it as the error on the blocked transition.
  jira:workflowValidator:
    - key: precedent-open-conflict-validator
      name: "Walkdown: no unresolved decision conflict"
      description: Blocks the transition while this work order conflicts with a standing site decision recorded in Walkdown.
      expression: >-
        issue.properties['walkdown.check'] == null || issue.properties['walkdown.check'].status != 'conflict'
        ? true
        : 'Blocked by Walkdown: this work order conflicts with a standing decision: "'
          + issue.properties['walkdown.check'].summary
          + '". Open the Walkdown panel on this work order to reaffirm, supersede or withdraw.'
      errorMessage: Blocked by Walkdown. This work order conflicts with a standing site decision.
      projectTypes: ['company-managed', 'team-managed']
  # Index the `walkdown.check` issue property so JQL can find blocked work orders:
  #   walkdownStatus = conflict   ·   walkdownSite = "<site id>"
  jira:entityProperty:
    - key: walkdown-check-index
      entityType: issue
      propertyKey: walkdown.check
      values:
        - path: status
          type: string
          searchAlias: walkdownStatus
        - path: siteId
          type: string
          searchAlias: walkdownSite
  # Forge Object Store (Preview): scans, photos, audio. Adding it is a major version upgrade (admin must approve).
  objectStore:
    - key: precedent-objects
      storageClass: standard
resources:
  - key: workspace
    path: static/workspace/dist
permissions:
  scopes:
    # Read work orders and their `walkdown.check` property; write that property (spike 3 test controls, later the check).
    - read:jira-work
    - write:jira-work
    # Sites records in Forge KVS.
    - storage:app
    # Jira Assets (spike 4): find the workspace, then create/read the Walkdown schema, types, attributes, objects.
    # No delete scopes: Walkdown never deletes customer Assets data.
    - read:servicedesk-request
    - read:cmdb-schema:jira
    - write:cmdb-schema:jira
    - read:cmdb-type:jira
    - write:cmdb-type:jira
    - read:cmdb-attribute:jira
    - write:cmdb-attribute:jira
    - read:cmdb-object:jira
    - write:cmdb-object:jira
    - read:cmdb-icon:jira
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/0fa45447-08dc-430d-93a1-8501bd630d9d
